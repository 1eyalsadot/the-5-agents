<title>כוורת</title>

<style>
:root {
  --bg: #eef1f6;
  --surface: #ffffff;
  --surface-alt: #e4e8f0;
  --ink: #140d41;
  --ink-soft: #514c78;
  --muted: #85809f;
  --line: #dadfec;
  --uriel-green: #7cb928;
  --shadow: 0 1px 2px rgba(20,13,65,0.06), 0 8px 24px rgba(20,13,65,0.06);
  --radius: 16px;
  --note-bg: #eef7de;
  --note-ink: #4a7a12;
  --font-head: 'Assistant', -apple-system, "Segoe UI", sans-serif;
  --font-body: 'Heebo', -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #100a30; --surface: #1a1350; --surface-alt: #251a63;
    --ink: #f3f1ff; --ink-soft: #c6c0ea; --muted: #948ec2; --line: #382d78;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    --note-bg: #23331a; --note-ink: #a7d66b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #100a30; --surface: #1a1350; --surface-alt: #251a63;
  --ink: #f3f1ff; --ink-soft: #c6c0ea; --muted: #948ec2; --line: #382d78;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  --note-bg: #23331a; --note-ink: #a7d66b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; direction: rtl; }
::selection { background: var(--uriel-green); color: #fff; }
.page { max-width: 1240px; margin: 0 auto; padding: 28px 20px 64px; }

.topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-bottom: 20px; margin-bottom: 22px; border-bottom: 1px solid var(--line); }
.brand .mark { font-family: var(--font-head); font-weight: 800; font-size: 26px; }
.stats { font-size: 13px; color: var(--muted); }
.stats b { color: var(--ink); font-size: 15px; }

.cat-band { margin: 34px 0 14px; padding: 11px 18px; background: var(--ink); border-radius: 10px; display: flex; align-items: center; justify-content: space-between; }
.cat-band:first-of-type { margin-top: 0; }
.cat-band h2 { margin: 0; font-family: var(--font-head); font-weight: 700; font-size: 15px; color: var(--uriel-green); }
.cat-band .cat-count { font-size: 12px; color: var(--ink-soft); }

.sub-head { margin: 22px 0 10px; display: flex; align-items: baseline; gap: 10px; }
.sub-head:first-child { margin-top: 4px; }
.sub-head h3 { margin: 0; font-family: var(--font-head); font-weight: 700; font-size: 13px; color: var(--ink-soft); white-space: nowrap; }
.sub-head .rule { flex: 1; height: 1px; background: var(--line); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
.grid + .sub-head { margin-top: 28px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; }
.card .shot { position: relative; aspect-ratio: 4/5; background: var(--surface-alt); overflow: hidden; }
.card .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .shot.contain img { object-fit: contain; padding: 14px; }
.card .shot.missing { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; text-align: center; padding: 12px; }

.card .shot .pack-badge { position: absolute; left: 10px; bottom: 10px; z-index: 2; direction: ltr; background: var(--uriel-green); color: #10230a; font-family: var(--font-head); font-weight: 800; font-size: 12px; letter-spacing: .02em; padding: 5px 12px; border-radius: 999px; box-shadow: 0 2px 8px rgba(0,0,0,0.25); }


.card .swatches { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px; background: var(--surface-alt); }
.card .swatches .sw { flex: 0 0 auto; width: 52px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.card .swatches .sw .thumb { width: 52px; height: 52px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
.card .swatches .sw img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .swatches .sw .cname { font-size: 9.5px; color: var(--muted); text-align: center; line-height: 1.15; }
.card .swatches .sw.active .thumb { border: 2px solid var(--uriel-green); }

.card .body { padding: 14px 14px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.card h3 { margin: 0; font-family: var(--font-head); font-weight: 700; font-size: 15px; line-height: 1.3; }
.card .sku-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.card .sku { font-family: ui-monospace, "SF Mono", Consolas, monospace; background: var(--surface-alt); color: var(--ink-soft); padding: 2px 7px; border-radius: 6px; font-size: 11.5px; align-self: flex-start; }
.card .note { font-family: var(--font-head); font-weight: 700; background: var(--note-bg); color: var(--note-ink); padding: 2px 8px; border-radius: 6px; font-size: 11px; }
.card .prices { margin-top: auto; padding-top: 8px; border-top: 1px dashed var(--line); display: flex; flex-direction: column; gap: 4px; }
.card .price-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; }
.card .price-row .label { color: var(--muted); font-size: 12px; }
.card .price-row.consumer .val { font-family: var(--font-head); font-weight: 800; font-size: 18px; color: var(--ink); font-variant-numeric: tabular-nums; }
.card .price-row.yarpa .val { font-family: var(--font-head); font-weight: 800; font-size: 16px; color: var(--uriel-green); font-variant-numeric: tabular-nums; }

@media print {
  .page { max-width: none; padding: 0 6mm; }
  .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .cat-band { break-after: avoid; }
  .sub-head { break-after: avoid; }
  .card { break-inside: avoid; }
}
</style>

<div class="page">

<script>
function ils(n) { return n == null ? '—' : '₪' + n.toLocaleString('he-IL', {minimumFractionDigits: 2, maximumFractionDigits: 2}); }

function card(p) {
  const containCls = p.contain ? ' contain' : '';
  const shot = p.img
    ? `<div class="shot${containCls}"><img src="images/${p.img}" alt="${p.product}"></div>`
    : `<div class="shot missing">אין תמונה זמינה באתר</div>`;
  const note = p.note ? `<span class="note">${p.note}</span>` : '';
  return `
  <div class="card">
    ${shot}
    <div class="body">
      <h3>${p.product}</h3>
      <div class="sku-row"><span class="sku">${p.base}</span>${note}</div>
      <div class="prices">
        <div class="price-row consumer"><span class="label">מחיר צרכן</span><span class="val">${ils(p.consumer)}</span></div>
        <div class="price-row yarpa"><span class="label">מחיר ירפא</span><span class="val">${ils(p.yarpa)}</span></div>
      </div>
    </div>
  </div>`;
}

function cardFeatured(p) {
  const main = p.colors[0];
  const badge = p.badge ? `<div class="pack-badge">${p.badge}</div>` : '';
  const shotInner = p.heroImg
    ? `<img src="images/${p.heroImg}" alt="${p.product}">`
    : `<img src="images/${main.img}" alt="${p.product} - ${main.name}">`;
  const swatches = p.colors.map((c, i) => `
    <div class="sw${i === 0 ? ' active' : ''}">
      <div class="thumb"><img src="images/${c.img}" alt="${p.product} - ${c.name}"></div>
      <div class="cname">${c.name}</div>
    </div>`).join('');
  return `
  <div class="card">
    <div class="shot">${shotInner}${badge}</div>
    <div class="swatches">${swatches}</div>
    <div class="body">
      <h3>${p.product}</h3>
      <span class="sku">${p.base}</span>
      <div class="prices">
        <div class="price-row consumer"><span class="label">מחיר צרכן</span><span class="val">${ils(p.consumer)}</span></div>
        <div class="price-row yarpa"><span class="label">מחיר ירפא</span><span class="val">${ils(p.yarpa)}</span></div>
      </div>
    </div>
  </div>`;
}
