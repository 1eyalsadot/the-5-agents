<style>
:root {
  --bg: #eef1f6;
  --surface: #ffffff;
  --surface-alt: #e4e8f0;
  --ink: #140d41;
  --ink-soft: #514c78;
  --muted: #85809f;
  --line: #dadfec;
  --gold: #ffd500;
  --gold-ink: #6b5900;
  --uriel-green: #7cb928;
  --shadow: 0 1px 2px rgba(20,13,65,0.06), 0 8px 24px rgba(20,13,65,0.06);
  --font-head: 'Assistant', -apple-system, "Segoe UI", sans-serif;
  --font-body: 'Heebo', -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #100a30; --surface: #1a1350; --surface-alt: #251a63;
    --ink: #f3f1ff; --ink-soft: #c6c0ea; --muted: #948ec2; --line: #382d78;
    --gold: #ffd500; --gold-ink: #3a3000;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #100a30; --surface: #1a1350; --surface-alt: #251a63;
  --ink: #f3f1ff; --ink-soft: #c6c0ea; --muted: #948ec2; --line: #382d78;
  --gold: #ffd500; --gold-ink: #3a3000;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; direction: rtl; }
.page { max-width: 980px; margin: 0 auto; padding: 24px 20px 56px; }

.topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-bottom: 18px; margin-bottom: 8px; border-bottom: 1px solid var(--line); }
.brand .mark { font-family: var(--font-head); font-weight: 800; font-size: 24px; }
.brand .mark span { color: var(--uriel-green); }
.brand .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
.stats { font-size: 12.5px; color: var(--muted); }
.stats b { color: var(--ink); }

.col-header {
  display: grid;
  grid-template-columns: 96px 1.3fr 0.9fr 1fr 1fr 1fr;
  gap: 14px;
  padding: 10px 14px;
  font-size: 11.5px;
  color: var(--muted);
  letter-spacing: 0.02em;
  font-weight: 700;
}

.rows { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }

.row {
  display: grid;
  grid-template-columns: 96px 1.3fr 0.9fr 1fr 1fr 1fr;
  gap: 14px;
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: var(--shadow);
  padding: 10px 14px;
}
.row .shot {
  width: 96px; height: 96px;
  border-radius: 8px;
  overflow: hidden;
  background: var(--surface-alt);
  position: relative;
  flex-shrink: 0;
}
.row .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.row .promo-tag {
  position: absolute; top: 4px; inset-inline-start: 4px;
  background: var(--gold); color: var(--gold-ink);
  font-family: var(--font-head); font-weight: 800; font-size: 9.5px;
  padding: 2px 6px; border-radius: 999px;
}
.row .name-cell h3 { margin: 0 0 3px; font-family: var(--font-head); font-weight: 700; font-size: 14.5px; line-height: 1.3; }
.row .sku { font-family: ui-monospace, "SF Mono", Consolas, monospace; background: var(--surface-alt); color: var(--ink-soft); padding: 1.5px 6px; border-radius: 5px; font-size: 11px; }
.row .barcode { font-size: 10.5px; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
.row .cell { font-size: 13px; font-variant-numeric: tabular-nums; }
.row .cell .label { display: block; font-size: 10.5px; color: var(--muted); margin-bottom: 2px; }
.row .final { color: var(--uriel-green); font-family: var(--font-head); font-weight: 800; font-size: 16px; }
.row .msrp-cell .val { color: var(--muted); }

@media (max-width: 720px) {
  .col-header { display: none; }
  .row { grid-template-columns: 76px 1fr; grid-template-areas: "shot name" "shot cost" "shot disc" "shot final"; row-gap: 4px; }
  .row .shot { grid-area: shot; width: 76px; height: 76px; }
  .row .name-cell { grid-area: name; }
  .row .cost-cell { grid-area: cost; }
  .row .disc-cell { grid-area: disc; }
  .row .final-cell { grid-area: final; }
}

footer { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); text-align: center; }
</style>
