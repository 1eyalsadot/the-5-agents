<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מכירות — סטטוס אוקטובר</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: light;
    --bg: #f3f4f8;
    --surface: #ffffff;
    --ink: #0b1733;
    --ink-soft: #4a5572;
    --muted: #7c84a0;
    --line: #e3e6ef;
    --series-actual: #2A4D8F;
    --series-target: #E0A62B;
    --shadow: 0 1px 2px rgba(11,23,51,0.06), 0 8px 24px rgba(11,23,51,0.06);
    --radius: 16px;
    --font-head: 'Assistant', -apple-system, "Segoe UI", sans-serif;
    --font-body: 'Inter', -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1222; --surface: #171c33; --ink: #f1f3fb; --ink-soft: #c3c9e0;
      --muted: #8992b3; --line: #2b3153;
      --series-actual: #5B8DEF; --series-target: #C98500;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1222; --surface: #171c33; --ink: #f1f3fb; --ink-soft: #c3c9e0;
    --muted: #8992b3; --line: #2b3153;
    --series-actual: #5B8DEF; --series-target: #C98500;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    padding: 24px 16px 40px;
  }
  .page {
    max-width: 1280px;
    margin: 0 auto;
  }
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px 28px 20px;
  }
  .title {
    font-family: var(--font-head);
    font-weight: 800;
    font-size: clamp(22px, 3.2vw, 30px);
    color: var(--ink);
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 20px;
  }

  .legend {
    display: flex;
    gap: 20px;
    align-items: center;
    margin-bottom: 8px;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .swatch.actual { background: var(--series-actual); }
  .swatch.target { background: var(--series-target); }

  .chart-wrap { position: relative; width: 100%; }
  .chart-svg { width: 100%; height: auto; display: block; overflow: visible; }

  .gridline { stroke: var(--line); stroke-width: 1; }
  .baseline { stroke: var(--line); stroke-width: 1.5; }
  .axis-label { font-family: var(--font-body); font-size: 11px; fill: var(--muted); }
  .cat-label { font-family: var(--font-body); font-size: 11px; fill: var(--ink-soft); }

  .bar-actual { fill: var(--series-actual); }
  .bar-target { fill: var(--series-target); }
  .bar { transition: opacity 0.15s ease; }
  .bar-group:hover .bar { opacity: 0.75; }
  .bar-group:hover .bar-hovered { opacity: 1; }

  .bar-label {
    font-family: var(--font-body);
    font-size: 10.5px;
    font-weight: 600;
    fill: var(--ink-soft);
  }

  .hit-target { cursor: pointer; }

  .tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--ink);
    color: var(--surface);
    font-family: var(--font-body);
    font-size: 12.5px;
    line-height: 1.5;
    padding: 8px 12px;
    border-radius: 8px;
    box-shadow: var(--shadow);
    opacity: 0;
    transform: translate(-50%, -8px);
    transition: opacity 0.1s ease;
    white-space: nowrap;
    z-index: 10;
  }
  .tooltip.visible { opacity: 1; }
  .tooltip b { font-weight: 700; }
  .tooltip .tt-row { display: flex; justify-content: space-between; gap: 14px; }
  .tooltip .tt-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-left: 6px; }

  .stat-row {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 10px 16px;
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
  }
  .stat-label { font-size: 13px; color: var(--muted); }
  .stat-number {
    font-family: var(--font-head);
    font-weight: 800;
    font-size: 34px;
    color: var(--ink);
  }
  .stat-pct {
    font-family: var(--font-head);
    font-weight: 800;
    font-size: 34px;
    color: var(--series-target);
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 18px;
    padding-top: 14px;
    font-size: 11px;
    color: var(--muted);
  }
  .brand { font-family: var(--font-head); font-weight: 800; letter-spacing: 0.08em; color: var(--ink-soft); }

  @media (max-width: 640px) {
    .card { padding: 20px 16px 16px; }
    .stat-number, .stat-pct { font-size: 26px; }
  }
</style>

<script>
(function() {
  var wrap = document.getElementById('chartWrap');
  var tooltip = document.getElementById('tooltip');
  var groups = wrap.querySelectorAll('.bar-group');

  function fmt(n) {
    return new Intl.NumberFormat('he-IL').format(n) + ' ₪';
  }

  groups.forEach(function(g) {
    var actualBar = g.querySelector('.bar-actual');
    var targetBar = g.querySelector('.bar-target');
    actualBar.classList.add('bar-hovered-src');
    var label = g.getAttribute('data-label');
    var actual = parseInt(g.getAttribute('data-actual'), 10);
    var target = parseInt(g.getAttribute('data-target'), 10);
    var pct = target > 0 ? Math.round((actual / target) * 100) : 0;

    g.addEventListener('mousemove', function(e) {
      var rect = wrap.getBoundingClientRect();
      var x = e.clientX - rect.left;
      var y = e.clientY - rect.top;
      tooltip.innerHTML =
        '<div><b>' + label + '</b></div>' +
        '<div class="tt-row"><span><span class="tt-dot" style="background:var(--series-actual)"></span>בפועל</span><b>' + fmt(actual) + '</b></div>' +
        '<div class="tt-row"><span><span class="tt-dot" style="background:var(--series-target)"></span>מטרה</span><b>' + fmt(target) + '</b></div>' +
        '<div class="tt-row"><span>ביצוע</span><b>' + pct + '%</b></div>';
      tooltip.style.left = x + 'px';
      tooltip.style.top = y + 'px';
      tooltip.classList.add('visible');
    });
    g.addEventListener('mouseleave', function() {
      tooltip.classList.remove('visible');
    });
  });
})();
</script>
